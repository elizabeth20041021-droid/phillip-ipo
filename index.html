<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSHK 專業投資者認證系統 (V4-直觀版)</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #0B0E11; color: #EAECEF; }
        .futu-dot { position: absolute; border: 2px solid #FF3B30; background: rgba(255,59,48,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FF3B30; font-weight: bold; font-size: 11px; box-shadow: 0 0 8px rgba(255,59,48,0.6); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Navigation Header -->
    <header class="border-b border-gray-800 bg-[#14181F] px-6 py-4 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition cursor-pointer">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-base font-semibold text-gray-100 tracking-wide">輝立證券 PSHK 專業投資者認證系統</h1>
        </div>
        <div class="flex items-center gap-2 text-xs bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="current-step-indicator" class="text-gray-400 font-medium">步驟 0：觸發入口</span>
        </div>
    </header>

    <!-- Main Dynamic Workspace -->
    <main class="flex-1 flex max-w-7xl w-full mx-auto p-6 gap-6 items-stretch">
        
        <!-- LEFT: App UI Mobile Simulator -->
        <div class="w-[390px] bg-[#14181F] border border-gray-800 rounded-[36px] shadow-2xl flex flex-col relative overflow-hidden shrink-0 select-none">
            <!-- Mobile Top Status Bar -->
            <div class="px-6 pt-4 pb-2 flex justify-between items-center text-xs text-gray-500 font-medium bg-[#14181F]">
                <span>9:34</span>
                <div class="flex items-center gap-1.5">
                    <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                    <span class="text-[10px] font-bold">5G</span>
                    <i data-lucide="battery" class="w-4 h-4"></i>
                </div>
            </div>

            <!-- Simulator Dynamic Viewport -->
            <div id="simulator-content" class="flex-1 overflow-y-auto px-5 py-3 hide-scrollbar flex flex-col justify-between bg-[#0B0E11]">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- RIGHT: Architecture Flow & Database Spec Explainer -->
        <div class="flex-1 bg-[#14181F] border border-gray-800 rounded-2xl p-6 flex flex-col justify-between shadow-lg">
            <div>
                <div class="flex items-center gap-2.5 mb-4">
                    <div id="flow-node-badge" class="px-2.5 py-0.5 rounded text-[11px] font-bold tracking-wider">NODE 0</div>
                    <h2 id="flow-node-title" class="text-lg font-bold text-white">節點架構標題</h2>
                </div>
                <div class="border-t border-gray-800 my-4"></div>
                <div id="flow-node-desc" class="text-sm text-gray-400 space-y-4 leading-relaxed">
                    <!-- Injected via JavaScript -->
                </div>
            </div>

            <!-- Backend Database Real-time Logger -->
            <div class="mt-6 border-t border-gray-800 pt-4">
                <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i data-lucide="database" class="w-3.5 h-3.5 text-emerald-500"></i> 後台數據庫狀態與核驗邏輯對照 (必填欄位)
                </p>
                <div id="backend-status-box" class="bg-gray-950 border border-gray-800 rounded-xl p-4 text-xs font-mono text-emerald-400 space-y-1">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <!-- Global Framework Controller Logic -->
    <script>
        let currentStep = 'step0';
        let selectedPath = ''; 
        let hasScrolled = false;

        const flowData = {
            step0: {
                indicator: '步驟 0：系統導流與自動攔截入口',
                badgeColor: 'bg-blue-500/10 text-blue-400 border border-blue-500/20',
                nodeType: '0. Entry Points (系統導流與自動攔截入口)',
                desc: `
                    <p class="font-medium text-gray-200">本節點對應流程圖起點，包含兩種自動導流路徑：</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[App交易端攔截]</strong> 用戶在交易端點選PI專屬產品（如國際配售、配售債券、VA虛擬資產）時，系統自動觸發攔截。</li>
                        <li><strong class="text-gray-300">[專屬直達入口]</strong> 用戶於「我的帳戶 &rarr; 帳戶升級 &rarr; 專業投資者認證」主動發起申請。</li>
                    </ul>
                `,
                db: `Client_Action: "INTERCEPT_OR_UPGRADE"<br>Trigger_Source: "App_Bond_Order_Page"<br>Current_PI_Status: "NON_PI"`
            },
            step1: {
                indicator: '步驟 1：智能入口、合規教育與自動分流',
                badgeColor: 'bg-blue-500/10 text-blue-400 border border-blue-500/20',
                nodeType: '1. Intelligent Hub (智能入口、合規教育與自動分流器)',
                desc: `
                    <p class="text-amber-400 font-medium">★ 體驗突破：已成功合併原 V3 的第 1、2、3 步，消除多重跳转</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[合規門檻提示]</strong> 清楚揭示 Net Portfolio &ge; HKD 8,000,000 (或等值外幣) 門檻與保障變更公告。</li>
                        <li><strong class="text-gray-300">[後台自動 KYC 識別]</strong> 系統自動加載帳戶基本資料，動態判定「個人/聯名屬性」或「法團架構提示」，不再需要用戶手動初篩。</li>
                        <li><strong class="text-gray-300">[前端平鋪分流選擇]</strong> 介紹頁直接平鋪展示路徑 A 與路徑 B 的觸發按鈕，資產充足客戶可一鍵直達極速路徑。</li>
                    </ul>
                `,
                db: `KYC_Fetch: "SUCCESS"<br>Account_Type: "INDIVIDUAL_HONGKONG"<br>Auto_Calculated_Internal_Value: "HKD 8,450,000" (滿足8M門檻)`
            },
            step4A: {
                indicator: '步驟 2 (A)：輝立內部資產即時核驗',
                badgeColor: 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20',
                nodeType: '4A. Path A: 輝立內部資產即時核驗 (極速最優解)',
                desc: `
                    <p class="font-medium text-gray-200">針對輝立內部資產充足之客戶，啟動全自動化無阻力核驗：</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[全自動計算]</strong> 整合 PSHK 證券、期貨及現金帳戶等當日實時估值。</li>
                        <li><strong class="text-gray-300">[債務嚴格扣除]</strong> 執行 Net Valuation，全自動扣除內部 Margin 欠款與質押借貸，杜絕資產虛高。</li>
                        <li><strong class="text-gray-300">[多幣種折算]</strong> 自動套用當日收盤牌價進行外幣等值折算 (符合 Cap.571D s.2A 要求)。</li>
                    </ul>
                `,
                db: `Verification_Path: "PATH_A_INTERNAL"<br>Net_Valuation_Status: "PASSED"<br>Internal_Margin_Debt_Deducted: "HKD 150,000"`
            },
            step4B: {
                indicator: '步驟 2 (B)：外部資產憑證上載與範例引導',
                badgeColor: 'bg-red-500/10 text-red-400 border border-red-500/20',
                nodeType: '4B. Path B: 外部資產與法定文件上載 (對標富途視覺強化版)',
                desc: `
                    <p class="text-red-400 font-medium">★ 體驗突破：引入富途式紅圈範例，進行強視覺引導</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[引入紅圈範例]</strong> 前端介面直接平鋪包含紅圈指標的標準綜合月結單範例，明確引導客戶核對對比細節。</li>
                        <li><strong class="text-gray-300">[四大強制核心]</strong> 提示客戶核對：①客戶姓名完全一致、②發行機構清晰完整、③合格資產滿足門檻、④發出日期在有效期內（12個月內，建議3個月）。</li>
                        <li><strong class="text-gray-300">[前端硬限制]</strong> 拒絕局部截圖與不合規裁剪，僅允許 PDF、JPG、PNG 高清文檔上傳。</li>
                    </ul>
                `,
                db: `Verification_Path: "PATH_B_EXTERNAL"<br>Document_Upload_Format: "PDF_OR_IMAGE"<br>SLA_Commitment: "1_WORKING_DAY"`
            },
            step5: {
                indicator: '步驟 3：15.3B 風險披露與法定豁免確認',
                badgeColor: 'bg-blue-500/10 text-blue-400 border border-blue-500/20',
                nodeType: '5. 15.3B Risk Disclosure & Consequences (法定風險與豁免後果揭示)',
                desc: `
                    <p class="font-medium text-gray-200">執行香港證監會《操守準則》15.3B 與 15.5 的最嚴格合規落實：</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[強制滾動互動]</strong> 條文介面必須滑動閱讀至 100% 底部，方可激活下方的獨立勾選框。</li>
                        <li><strong class="text-gray-300">[三個獨立同意框]</strong> 拒絕任何預先勾選 (Non-pre-ticked)，客戶需分別獨立確認：完全理解豁免保障、自願接受PI分類、知悉擁有隨時書面撤回的權利。</li>
                    </ul>
                `,
                db: `SFC_Code_Compliance: "15.3B_AND_15.5"<br>Scroll_Engagement_Rate: "100%"<br>Consent_Boxes_Checked: "[TRUE, TRUE, TRUE]"`
            },
            step6: {
                indicator: '步驟 4：申請摘要與電子驗證簽章',
                badgeColor: 'bg-blue-500/10 text-blue-400 border border-blue-500/20',
                nodeType: '6. Review + OTP (申請摘要與電子驗證)',
                desc: `
                    <p class="font-medium text-gray-200">整合審查摘要，進行最終電子申報簽章：</p>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong class="text-gray-300">[綜合 Review 摘要]</strong> 集中檢視：法定身分類別、核驗資產總值、多幣種折算等值與產品授權開通範圍。</li>
                        <li><strong class="text-gray-300">[雙重簡訊認證]</strong> 輸入手機號碼並發送安全 OTP 驗證碼作為最終電子簽名，聯名帳戶各持有者需各自單獨通過驗證。</li>
                    </ul>
                `,
